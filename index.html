<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lavacar • Redirecionando</title>
    <meta http-equiv="refresh" content="0; url=cliente.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        if (window.location.pathname.endsWith('index.html') || window.location.pathname.endsWith('/')) {
          window.location.replace('cliente.html');
        }
      });
    </script>
  </head>
  <body class="redirect">
    <main class="redirect__content">
      <h1>Redirecionando para o portal do cliente…</h1>
      <p>
        Se o redirecionamento não acontecer automaticamente,
        <a href="cliente.html">clique aqui para acessar a área do cliente</a>
        ou vá direto para a <a href="equipe.html">área da equipe</a>.
      </p>
    </main>
  </body>
</html>
